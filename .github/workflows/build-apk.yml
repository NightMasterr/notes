name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          node -e "require('sharp')({create:{width:1024,height:1024,channels:3,background:'#15333a'}}).png().toFile('assets/icon-background.png')"
          npx capacitor-assets generate --android

      - name: Safety check for the icon
        run: |
          RES=android/app/src/main/res
          if grep -q ic_launcher_background $RES/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null && ! ls $RES/mipmap-*/ic_launcher_background* >/dev/null 2>&1; then
            echo "Icon background missing, using the simple icon instead"
            rm -rf $RES/mipmap-anydpi-v26
          fi

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Notes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: Notes.apk
