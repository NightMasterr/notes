# Run this ONCE (Actions tab -> "Create signing key" -> Run workflow).
# It makes your permanent app-signing key and a text file with the values to save as secrets.
name: Create signing key

on: workflow_dispatch

jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - name: Make the key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore notes-release.jks -alias notes -keyalg RSA -keysize 4096 -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Notes"
          {
            echo "KEYSTORE_PASSWORD"
            echo "$PASS"
            echo
            echo "KEY_ALIAS"
            echo "notes"
            echo
            echo "KEYSTORE_BASE64"
            base64 -w0 notes-release.jks
            echo
          } > signing-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.txt
          retention-days: 1
